<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121b2d" />
      <stop offset="100%" stop-color="#1a0f2e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9b51e0" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Background Grid / Dynamic Aspect -->
  <g opacity="0.15">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300" stroke="#00f2fe" stroke-width="1" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="0" to="32" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400" stroke="#7928ca" stroke-width="1" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="0" to="32" dur="6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Background Dynamic Pulses (Behind text) -->
  <circle cx="200" cy="200" r="140" fill="url(#glowGrad)" filter="url(#softGlow)" opacity="0.4">
    <animate attributeName="r" values="120;160;120" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite" />
  </circle>

  <circle cx="1000" cy="200" r="160" fill="url(#glowGrad)" filter="url(#softGlow)" opacity="0.3">
    <animate attributeName="r" values="140;180;140" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Camera Lens Visuals (Positioned on the Right, Non-overlapping with text) -->
  <g transform="translate(980, 200)" filter="url(#glow)">
    <!-- Outer Aperture Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="12 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <!-- Inner Lens Ring -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ff007f" stroke-width="3" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
    </circle>
    <!-- Lens Center -->
    <circle cx="0" cy="0" r="40" fill="#121b2d" stroke="#00f2fe" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="url(#cyanPurple)" />
    <!-- Recording indicator -->
    <circle cx="65" cy="-65" r="7" fill="#ff0055" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and contrast) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
      <circle cx="20" cy="17" r="6" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#00f2fe" letter-spacing="1.5">EDGE AI &amp; VISION ECOSYSTEM</text>
    </g>

    <!-- Main Title (Foreground) -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Deep Learning
    </text>
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="-0.5">
      Video Camera 🎥 🧠
    </text>

    <!-- Subtitle (Foreground) -->
    <text x="0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" width="700">
      Curated Directory of Edge Vision Frameworks, Smart NVRs &amp; AI Camera SaaS Platforms
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" />
        <text x="65" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Jetson &amp; Hailo</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" />
        <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🛡️ Smart NVR &amp; ANPR</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" />
        <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🌐 Cloud &amp; Edge Vision</text>
      </g>
    </g>
  </g>
</svg>
