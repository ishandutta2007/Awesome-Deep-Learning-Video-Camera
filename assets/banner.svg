<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e17"/><stop offset="50%" stop-color="#121b2d"/><stop offset="100%" stop-color="#1a0f2e"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#9b51e0"/><stop offset="100%" stop-color="#ff007f"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#7928ca" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g opacity=".15"><path stroke="#00f2fe" stroke-dasharray="8 8" stroke-width="1" d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300"><animate attributeName="stroke-dashoffset" dur="4s" from="0" repeatCount="indefinite" to="32"/></path><path stroke="#7928ca" stroke-dasharray="8 8" stroke-width="1" d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400"><animate attributeName="stroke-dashoffset" dur="6s" from="0" repeatCount="indefinite" to="32"/></path></g><circle cx="200" cy="200" r="140" fill="url(#glowGrad)" filter="url(#softGlow)" opacity=".4"><animate attributeName="r" dur="5s" repeatCount="indefinite" values="120;160;120"/><animate attr